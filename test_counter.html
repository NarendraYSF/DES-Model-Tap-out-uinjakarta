<!DOCTYPE html>
<html>
<head>
<style>
@page { size: A4; margin: 3cm; }
@page cover { margin: 3cm; @bottom-center { content: none; } }
@page prelim { margin: 3cm; @bottom-center { content: counter(page, lower-roman); } }
@page body { margin: 3cm; @bottom-center { content: counter(page, decimal); } }

.c { page: cover; break-after: page; }
.p { page: prelim; break-after: page; }
.b { page: body; break-after: page; }
.p1 { counter-reset: page 1; }
.b1 { counter-reset: page 1; }
</style>
</head>
<body>
<div class='c'>Cover</div>
<div class='p p1'>Prelim 1</div>
<div class='p'>Prelim 2</div>
<div class='b b1'>Body 1</div>
<div class='b'>Body 2</div>
</body>
</html>
