<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Tap-Out UIN Jakarta — Materi Presentasi (5 Slides)</title>
<style>
/* ================================================================
   DESIGN SYSTEM — DARK PROFESSIONAL SLIDE DECK
   ================================================================ */
:root {
  --bg: #070d1e;
  --card: #0f172a;
  --card2: #1e293b;
  --border: rgba(148,163,184,.15);
  --border2: rgba(148,163,184,.25);
  --t1: #f8fafc;
  --t2: #e2e8f0;
  --t3: #94a3b8;
  --t4: #64748b;
  --green: #10b981;
  --green2: #34d399;
  --blue: #3b82f6;
  --blue2: #60a5fa;
  --amber: #f59e0b;
  --amber2: #fbbf24;
  --rose: #ef4444;
  --rose2: #f87171;
  --purple: #8b5cf6;
  --cyan: #06b6d4;
  --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 10px 50px}

/* ================================================================
   TOP BAR
   ================================================================ */
.topbar{width:100%;max-width:1240px;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;z-index:100;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-weight:700;font-size:10px;padding:3px 9px;border-radius:16px;letter-spacing:.5px;text-transform:uppercase}
.brand-name{font-size:14px;font-weight:600;color:var(--t2)}
.brand-name b{color:var(--green)}
.nav{display:flex;align-items:center;gap:6px}
.nav-btn{background:rgba(30,41,59,.8);border:1px solid var(--border);color:var(--t1);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.nav-btn:hover{background:rgba(51,65,85,.9);border-color:#64748b;transform:translateY(-1px)}
.nav-btn.pri{background:linear-gradient(135deg,#059669,#10b981);border-color:transparent;color:#fff;font-weight:600}
.dots{display:flex;gap:5px;margin:0 8px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(148,163,184,.3);cursor:pointer;transition:all .2s}
.dot.on{background:var(--green);width:22px;border-radius:8px;box-shadow:0 0 8px var(--green)}
.mode{display:flex;background:rgba(15,23,42,.6);padding:3px;border-radius:8px;border:1px solid var(--border)}
.mode button{background:0 0;border:0;color:var(--t3);padding:5px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
.mode button.on{background:var(--card2);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* ================================================================
   SLIDE CARD (16:9)
   ================================================================ */
.wrap{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:24px}
.stage{width:100%}
.slide{width:100%;aspect-ratio:16/9;background:linear-gradient(145deg,#0f172a,#1e293b);border:1px solid rgba(148,163,184,.2);border-radius:18px;box-shadow:0 20px 25px -5px rgba(0,0,0,.5),0 0 25px rgba(16,185,129,.1);padding:32px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(148,163,184,.04) 1px,transparent 0);background-size:26px 26px;pointer-events:none;z-index:0}
.slide .g1{position:absolute;top:-100px;right:-100px;width:300px;height:300px;pointer-events:none;z-index:0}
.slide .g2{position:absolute;bottom:-120px;left:-80px;width:340px;height:340px;pointer-events:none;z-index:0}
.sc{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between}

/* ---- HEADER ---- */
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sh-left{max-width:80%}
.sh-cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin-bottom:4px}
.sh-title{font-size:24px;font-weight:800;line-height:1.22;color:#fff;letter-spacing:-.3px}
.sh-sub{font-size:12.5px;color:var(--t3);margin-top:3px;line-height:1.35}
.sh-right{text-align:right}
.sh-pill{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#34d399;font-size:11px;font-weight:700;padding:3px 10px;border-radius:16px}
.sh-course{font-size:9.5px;color:var(--t4);margin-top:4px;font-weight:500}

/* ---- BODY ---- */
.sb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}

/* ---- FOOTER ---- */
.sf{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(148,163,184,.1);font-size:10.5px;color:var(--t4)}
.sf-l{display:flex;align-items:center;gap:6px}
.sf-l span.sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--t4)}
.sf-r{font-weight:500;color:var(--t3)}

/* ================================================================
   SLIDE 1 — S=(E,A,V,T)
   ================================================================ */
.seavt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sc1{background:rgba(15,23,42,.65);border:1px solid rgba(148,163,184,.12);border-radius:12px;padding:13px 12px;display:flex;flex-direction:column}
.sc1.e{border-top:3px solid var(--blue)} .sc1.a{border-top:3px solid var(--green)} .sc1.v{border-top:3px solid var(--amber)} .sc1.t{border-top:3px solid var(--purple)}
.sc1-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sc1-let{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
.e .sc1-let{background:linear-gradient(135deg,#1d4ed8,#3b82f6)} .a .sc1-let{background:linear-gradient(135deg,#059669,#10b981)} .v .sc1-let{background:linear-gradient(135deg,#d97706,#f59e0b)} .t .sc1-let{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}
.sc1-term{font-size:12.5px;font-weight:700;color:var(--t2)}
.sc1 ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:10.8px;color:#cbd5e1;line-height:1.3}
.sc1 li{padding-left:10px;position:relative}
.sc1 li::before{content:"▸";position:absolute;left:0;color:var(--t4);font-size:9px;top:1px}
.sc1 li strong{color:#fff;font-weight:600}
.archbox{width:100%;background:rgba(15,23,42,.45);border:1px dashed rgba(148,163,184,.18);border-radius:10px;padding:8px 14px;display:flex;align-items:center;justify-content:space-around;font-size:10.5px;color:#cbd5e1;flex-wrap:wrap;gap:4px}
.arch-s{display:flex;align-items:center;gap:6px}
.arch-ic{width:22px;height:22px;border-radius:50%;background:rgba(30,41,59,.9);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--green);flex-shrink:0}
.arch-ar{color:var(--t4);font-size:12px}

/* ================================================================
   SLIDE 2 — 4 SCENARIO CARDS
   ================================================================ */
.scg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scc{background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.13);border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.scc.asis{border-top:3px solid var(--amber)}
.scc.shift{border:1.5px solid rgba(239,68,68,.55);background:linear-gradient(180deg,rgba(239,68,68,.07) 0%,rgba(15,23,42,.8) 100%);box-shadow:0 0 14px rgba(239,68,68,.12)}
.scc.frfid{border-top:3px solid var(--green)}
.scc.fkarc{border-top:3px solid var(--blue)}
.scc-n{font-size:12.5px;font-weight:700;color:#fff}
.scc-lane{font-size:10px;color:var(--t3);margin-top:2px;display:inline-block;background:rgba(30,41,59,.8);padding:1px 6px;border-radius:3px}
.scc-m{display:flex;flex-direction:column;gap:5px;margin:7px 0}
.scc-r{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;padding:3px 6px;background:rgba(15,23,42,.5);border-radius:5px;border:1px solid rgba(148,163,184,.06)}
.scc-lab{color:var(--t3)}
.scc-val{font-weight:700;font-size:11.5px;color:var(--t1)}
.vd{color:var(--rose)!important;font-weight:800} .vw{color:var(--amber)!important;font-weight:700} .vs{color:var(--green)!important;font-weight:700}
.scc-pill{font-size:9.5px;font-weight:700;text-transform:uppercase;padding:3px 7px;border-radius:10px;text-align:center;margin-top:3px}
.pw{background:rgba(245,158,11,.14);color:var(--amber2);border:1px solid rgba(245,158,11,.3)}
.pd{background:rgba(239,68,68,.18);color:var(--rose2);border:1px solid rgba(239,68,68,.4)}
.ps{background:rgba(16,185,129,.14);color:var(--green2);border:1px solid rgba(16,185,129,.3)}
.pi{background:rgba(59,130,246,.14);color:var(--blue2);border:1px solid rgba(59,130,246,.3)}
.callout{background:linear-gradient(90deg,rgba(239,68,68,.1),rgba(16,185,129,.1));border-left:3px solid var(--rose);border-radius:0 9px 9px 0;padding:9px 14px;display:flex;gap:14px;font-size:11.5px;line-height:1.4;align-items:flex-start}
.callout strong{color:#fff}
.callout-r{border-left:1px solid rgba(255,255,255,.12);padding-left:12px;min-width:220px;font-size:10.5px;color:#cbd5e1}

/* ================================================================
   SLIDE 3 — CHART + REAL IMAGES
   ================================================================ */
.s3lay{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;height:100%;align-items:stretch}
.chart-box{background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.16);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chart-title{font-size:12px;font-weight:700;color:var(--t2)}
.chart-tag{font-size:9.5px;background:rgba(59,130,246,.14);color:var(--blue2);padding:2px 7px;border-radius:8px;border:1px solid rgba(59,130,246,.3);cursor:pointer}
.chart-img{width:100%;flex:1;min-height:0;overflow:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#0d1117}
.chart-img img{width:100%;height:100%;object-fit:contain}
.chart-leg{display:flex;justify-content:center;gap:14px;font-size:10px;color:var(--t3);padding-top:5px;border-top:1px solid rgba(148,163,184,.08)}
.leg-i{display:flex;align-items:center;gap:5px}
.leg-c{width:9px;height:9px;border-radius:2px}
.pts{display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.pt{background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.1);border-radius:9px;padding:9px 10px;display:flex;align-items:flex-start;gap:10px}
.pt-ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:12px}
.pt-ic.d{background:rgba(239,68,68,.16);color:var(--rose2);border:1px solid rgba(239,68,68,.35)}
.pt-ic.s{background:rgba(16,185,129,.16);color:var(--green2);border:1px solid rgba(16,185,129,.35)}
.pt-ic.i{background:rgba(59,130,246,.16);color:var(--blue2);border:1px solid rgba(59,130,246,.35)}
.pt-ic.w{background:rgba(245,158,11,.16);color:var(--amber2);border:1px solid rgba(245,158,11,.35)}
.pt-t{font-size:11px;line-height:1.3;color:#cbd5e1}
.pt-t strong{color:#fff;font-size:11.5px;display:block;margin-bottom:1px}

/* ================================================================
   SLIDE 4 — FIT IMAGES + GOF TABLE
   ================================================================ */
.s4lay{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%}
.s4-img-col{display:flex;flex-direction:column;gap:10px}
.s4-imgbox{background:rgba(15,23,42,.6);border:1px solid var(--border);border-radius:10px;padding:8px;flex:1;display:flex;flex-direction:column}
.s4-imgbox .img-hdr{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.s4-imgbox .img-hdr span{font-size:9.5px;color:var(--t4);font-weight:400}
.s4-imgbox img{width:100%;flex:1;object-fit:contain;border-radius:6px;background:#fff;min-height:0}
.s4-data-col{display:flex;flex-direction:column;gap:10px}
.s4-card{background:rgba(15,23,42,.65);border:1px solid var(--border);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column}
.s4-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.s4-num{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.s4-card-title{font-size:12.5px;font-weight:700;color:#fff}
.s4-card p{font-size:10.8px;color:#cbd5e1;line-height:1.35}
.s4-card p strong{color:#fff}
.s4-stat{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 7px;border-radius:5px;background:rgba(30,41,59,.8);color:#93c5fd;margin-top:4px}
.ks-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);border-radius:6px;padding:5px 8px;font-size:10px;color:#fca5a5;margin-top:4px}
/* GOF mini-table */
.gof-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}
.gof-tbl th{background:rgba(30,41,59,.7);color:var(--t3);font-weight:600;padding:4px 6px;text-align:left;border-bottom:1px solid var(--border)}
.gof-tbl td{padding:3px 6px;border-bottom:1px solid rgba(148,163,184,.06);color:#cbd5e1}
.gof-tbl tr.best td{color:var(--green2);font-weight:600}
.gof-tbl tr.reject td{color:var(--rose2)}
.gof-tbl .r{text-align:right}

/* ================================================================
   SLIDE 5 — CONCLUSION 2-COL
   ================================================================ */
.s5lay{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%}
.s5-col{background:rgba(15,23,42,.65);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.s5-col.left{border-top:3px solid var(--blue)}
.s5-col.right{border-top:3px solid var(--green)}
.s5-hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid rgba(148,163,184,.1)}
.s5-hdr h4{font-size:13px;font-weight:700;color:#fff}
.s5-items{display:flex;flex-direction:column;gap:8px}
.s5-i{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.35;color:#cbd5e1}
.s5-b{width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.s5-b.bl{background:rgba(59,130,246,.18);color:var(--blue2)}
.s5-b.gr{background:rgba(16,185,129,.18);color:var(--green2)}
.s5-i strong{color:#fff;font-weight:600}
.s5-foot{font-size:10px;color:var(--t4);border-top:1px solid rgba(148,163,184,.08);padding-top:5px;margin-top:auto}

/* ================================================================
   NOTES DRAWER
   ================================================================ */
.notes{width:100%;max-width:1200px;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:-8px}
.notes-hdr{padding:10px 18px;background:rgba(30,41,59,.6);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.notes-hdr-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--t2)}
.notes-tag{background:rgba(16,185,129,.14);color:var(--green);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.notes-chev{color:var(--t3);transition:transform .3s}
.notes.open .notes-chev{transform:rotate(180deg)}
.notes-body{padding:16px 20px;font-size:12.5px;line-height:1.55;color:#cbd5e1;display:none;border-top:1px solid rgba(148,163,184,.08);background:rgba(11,19,43,.5)}
.notes.open .notes-body{display:block}
.nsl{margin-bottom:10px;position:relative;padding-left:16px}
.nsl::before{content:"💬";position:absolute;left:0;font-size:10px;top:2px}
.nsl strong{color:#fff}
.cue{display:inline-block;background:rgba(245,158,11,.14);color:var(--amber2);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;margin-right:5px}

/* ================================================================
   ALL-SLIDES MODE
   ================================================================ */
.all-grid{display:none;width:100%;flex-direction:column;gap:36px}
body.viewall .stage,body.viewall .notes{display:none!important}
body.viewall .all-grid{display:flex}
.sl-wrap{display:flex;flex-direction:column;gap:10px}
.sl-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:rgba(30,41,59,.6);border-radius:7px;font-size:11.5px;color:var(--t3)}
.sl-bar strong{color:#fff}

/* ================================================================
   MODAL
   ================================================================ */
.modal{display:none;position:fixed;inset:0;background:rgba(7,13,30,.88);backdrop-filter:blur(10px);z-index:999;justify-content:center;align-items:center;padding:20px}
.modal.on{display:flex}
.modal-box{max-width:920px;width:100%;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.modal-img{width:100%;max-height:76vh;object-fit:contain;border-radius:6px;background:#fff}
.modal-close{align-self:flex-end;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.35);color:var(--rose2);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600}
.modal-cap{font-size:11px;color:#cbd5e1;text-align:center}

/* PRINT */
@media print{body{background:#fff!important;padding:0!important}.topbar,.notes,.dots,.nav,.mode{display:none!important}.all-grid{display:flex!important;gap:0!important}.slide{page-break-after:always;border:none!important;box-shadow:none!important;border-radius:0!important}}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="brand">
    <span class="brand-badge">UIN Jakarta · TI</span>
    <div class="brand-name">Simulasi & Pemodelan Sistem: <b>Tap-Out Gate DES</b></div>
  </div>
  <div class="nav" id="navC">
    <button class="nav-btn" id="prevB" onclick="go(-1)">◀ Prev</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn pri" id="nextB" onclick="go(1)">Next ▶</button>
  </div>
  <div class="mode">
    <button class="on" id="mS" onclick="vm('s')">Slide</button>
    <button id="mA" onclick="vm('a')">Semua (SS)</button>
    <button onclick="window.print()">PDF</button>
  </div>
</header>

<main class="wrap" id="wrap">
  <!-- SINGLE VIEW -->
  <section class="stage" id="stage"><div id="active"></div></section>

  <!-- NOTES -->
  <section class="notes open" id="nd">
    <div class="notes-hdr" onclick="tN()">
      <div class="notes-hdr-l">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Catatan Presenter & Naskah Bicara
        <span class="notes-tag" id="nLabel">Slide 1/5</span>
      </div>
      <div class="notes-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
    </div>
    <div class="notes-body" id="nBody"></div>
  </section>

  <!-- ALL VIEW -->
  <section class="all-grid" id="allG"></section>
</main>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cM(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cM()">Tutup ✕</button>
    <img id="mImg" class="modal-img" src="" alt="Plot">
    <div class="modal-cap" id="mCap"></div>
  </div>
</div>

<script>
// ================================================================
// SLIDES DATA
// ================================================================
const S=[

// ---- SLIDE 1: S=(E,A,V,T) ----
{id:1,ref:"Slide 22",
render:()=>`<div class="slide">
<div class="g1" style="background:radial-gradient(circle,rgba(16,185,129,.2) 0%,transparent 70%)"></div>
<div class="g2" style="background:radial-gradient(circle,rgba(59,130,246,.1) 0%,transparent 70%)"></div>
<div class="sc">
<div class="sh">
 <div class="sh-left">
  <div class="sh-cat">⬡ Formalisasi Model Sistem Antrean</div>
  <h2 class="sh-title">Sistem Tap-Out: S = (E, A, V, T)</h2>
  <p class="sh-sub">Model Simulasi Kejadian Diskret (DES) Dua Gerbang Dedikasi Independen — SimPy 4.1 Python</p>

  </div>

   <ul>
    <li><strong>Kedatangan:</strong> Proses Poisson homogen (λ = N/3.600 s)</li>
    <li><strong>Antre:</strong> FIFO di lajur yang dialokasikan hingga gardu kosong</li>
    <li><strong>Tap-Out:</strong> Transaksi karcis atau tap RFID (durasi stokastik)</li>
    <li><strong>Keberangkatan:</strong> Palang terangkat → gardu terlepas → keluar sistem</li>

</div></div>`,
script:`<div class="nsl"><span class="cue">[PEMBUKA]</span> "Pada bagian ini saya mempresentasikan formalisasi model sistem tap-out menggunakan kerangka <strong>S = (E, A, V, T)</strong>."</div>
<div class="nsl"><span class="cue">[E]</span> "<strong>Entitas:</strong> Terdapat dua jenis entitas bergerak — kendaraan Karcis dan RFID — serta server berupa 2 gerbang Karcis paralel dan 1 gerbang RFID tunggal. Masing-masing memiliki antrean FIFO yang terpisah secara fisik."</div>

<div class="nsl"><span class="cue">[T]</span> "<strong>Waktu:</strong> Simulasi berjalan dalam satuan detik, 3.600 detik per sesi. Dieksekusi 200 replikasi per skenario dengan interval kepercayaan 95%."</div>`
